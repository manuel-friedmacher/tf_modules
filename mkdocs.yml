site_name: Terraform Modules Docs
repo_url: https://github.com/manuel-friedmacher/tf_modules.git
repo_name: manuel-friedmacher/tf_modules
docs_dir: docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
extra:
  version:
    provider: mike
    default: latest
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - BTP Subaccount: modules/build_sa/index.md
      - Cloud Foundry: modules/enable_cf/index.md
      - Workzone: modules/workzone/index.md
      - BTP ABAP Environment: modules/abap/index.md
